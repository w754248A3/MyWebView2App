<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间差计算器</title>
<style>
  /* ===== 基础重置与全局样式 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f0f2f5;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #333;
  }

  /* ===== 主卡片容器 —— 紧凑布局 ===== */
  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 28px 32px 24px;
    width: 460px;
    max-width: 95vw;
  }

  .card h1 {
    font-size: 1.25rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 20px;
    color: #1a1a2e;
  }

  /* ===== 输入区域 ===== */
  .input-group {
    margin-bottom: 14px;
  }

  .input-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 4px;
    color: #555;
  }

  .input-group input {
    width: 100%;
    padding: 8px 12px;
    font-size: 0.9rem;
    font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
    border: 1.5px solid #d0d5dd;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-group input:focus {
    border-color: #5b6af0;
    box-shadow: 0 0 0 3px rgba(91,106,240,0.1);
  }

  .input-group .hint {
    font-size: 0.72rem;
    color: #999;
    margin-top: 2px;
  }

  /* ===== 按钮 ===== */
  .btn-wrap {
    text-align: center;
    margin: 18px 0 12px;
  }

  .btn {
    padding: 9px 40px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
    background: #5b6af0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover {
    background: #4a56d4;
  }

  .btn:active {
    transform: scale(0.97);
  }

  /* ===== 错误提示 ===== */
  .error {
    color: #d92d20;
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.3em;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  /* ===== 分隔线 ===== */
  .divider {
    border: none;
    border-top: 1px solid #e8eaed;
    margin: 10px 0 14px;
  }

  /* ===== 结果区域 ===== */
  .result-section {
    margin-bottom: 12px;
  }

  .result-section h2 {
    font-size: 0.9rem;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1.5px solid #5b6af0;
    display: inline-block;
  }

  .result-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 0.88rem;
    padding: 3px 0;
  }

  .result-row .label {
    color: #666;
    white-space: nowrap;
  }

  .result-row .value {
    font-weight: 700;
    color: #5b6af0;
    font-family: 'Consolas', 'SF Mono', 'Menlo', monospace;
  }

  /* 早/晚标记 */
  .tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
    margin-left: 4px;
    vertical-align: middle;
  }

  .tag-early {
    background: #e3f2fd;
    color: #1565c0;
  }

  .tag-late {
    background: #fce4ec;
    color: #c62828;
  }
</style>
</head>
<body>

<div class="card">
  <h1>⏱ 时间差计算器</h1>

  <!-- ===== 输入 A ===== -->
  <div class="input-group">
    <label for="inputA">时间 A</label>
    <input type="text" id="inputA" placeholder="2026/03/31 17:44:44">
    <div class="hint">格式：YYYY/MM/DD 或 YYYY/MM/DD HH:mm:ss（留空则使用当前时间）</div>
  </div>

  <!-- ===== 输入 B ===== -->
  <div class="input-group">
    <label for="inputB">时间 B</label>
    <input type="text" id="inputB" placeholder="2026/03/31">
    <div class="hint">格式：YYYY/MM/DD 或 YYYY/MM/DD HH:mm:ss（留空则使用当前时间）</div>
  </div>

  <!-- ===== 计算按钮 ===== -->
  <div class="btn-wrap">
    <button class="btn" id="calcBtn">计算时间差</button>
  </div>

  <!-- ===== 错误信息显示区域 ===== -->
  <div class="error" id="errorMsg"></div>

  <!-- ===== 结果区域（初始隐藏） ===== -->
  <div id="resultArea" style="display:none;">
    <hr class="divider">

    <!-- 类别1：次日零点差 -->
    <div class="result-section">
      <h2>📌 类别一：早的时间「次日零点」与晚的时间之差</h2>
      <div class="result-row">
        <span class="label">总小时数：</span>
        <span class="value" id="cat1Hours">-</span>
      </div>
      <div class="result-row">
        <span class="label">折合：</span>
        <span class="value" id="cat1Days">-</span>
      </div>
    </div>

    <!-- 类别2：直接差 -->
    <div class="result-section">
      <h2>📌 类别二：两个时间直接之差</h2>
      <div class="result-row">
        <span class="label">总小时数：</span>
        <span class="value" id="cat2Hours">-</span>
      </div>
      <div class="result-row">
        <span class="label">折合：</span>
        <span class="value" id="cat2Days">-</span>
      </div>
    </div>

    <!-- 早/晚信息 -->
    <div class="result-row" style="margin-top:6px; font-size:0.82rem; color:#888;">
      <span id="orderInfo"></span>
    </div>
  </div>
</div>

<script>
// =====================================================================
//  获取 DOM 元素引用
// =====================================================================
var inputA    = document.getElementById('inputA');
var inputB    = document.getElementById('inputB');
var calcBtn   = document.getElementById('calcBtn');
var errorMsg  = document.getElementById('errorMsg');
var resultArea = document.getElementById('resultArea');

// 结果显示元素
var cat1HoursEl = document.getElementById('cat1Hours');
var cat1DaysEl  = document.getElementById('cat1Days');
var cat2HoursEl = document.getElementById('cat2Hours');
var cat2DaysEl  = document.getElementById('cat2Days');
var orderInfoEl = document.getElementById('orderInfo');

// =====================================================================
//  工具函数：解析时间字符串
//  支持格式：
//    完整： "YYYY/MM/DD HH:mm:ss"  例："2026/03/31 17:44:44"
//    仅日期："YYYY/MM/DD"          例："2026/03/31" → 默认 00:00:00
//  返回：解析成功的 Date 对象
//  返回 null：格式不正确或日期无效
// =====================================================================
function parseTimeString(str) {
  // 去除首尾空白
  var trimmed = str.trim();

  // 如果为空字符串，返回特殊标记
  if (trimmed === '') {
    return null;
  }

  // 定义两种格式的正则表达式
  var fullPattern = /^(\d{4})\/(\d{2})\/(\d{2}) (\d{2}):(\d{2}):(\d{2})$/;
  var datePattern = /^(\d{4})\/(\d{2})\/(\d{2})$/;

  var year, month, day, hours, minutes, seconds;

  // 尝试匹配完整格式
  var fullMatch = trimmed.match(fullPattern);
  if (fullMatch !== null) {
    year    = parseInt(fullMatch[1], 10);
    month   = parseInt(fullMatch[2], 10);
    day     = parseInt(fullMatch[3], 10);
    hours   = parseInt(fullMatch[4], 10);
    minutes = parseInt(fullMatch[5], 10);
    seconds = parseInt(fullMatch[6], 10);
  } else {
    // 尝试匹配仅日期格式
    var dateMatch = trimmed.match(datePattern);
    if (dateMatch !== null) {
      year    = parseInt(dateMatch[1], 10);
      month   = parseInt(dateMatch[2], 10);
      day     = parseInt(dateMatch[3], 10);
      // 仅日期时，时间默认为 00:00:00
      hours   = 0;
      minutes = 0;
      seconds = 0;
    } else {
      // 两种格式都不匹配 → 格式错误
      return null;
    }
  }

  // 使用本地时区构造 Date 对象
  // 注意：JavaScript 的月份从 0 开始（0 = 一月）
  var date = new Date(year, month - 1, day, hours, minutes, seconds);

  // 验证日期是否真实存在（例如排除 2月30日）
  // 如果构造函数自动修正了日期，则 getFullYear/getMonth/getDate 会与输入不一致
  var isValid = (
    date.getFullYear() === year &&
    date.getMonth() === month - 1 &&
    date.getDate() === day
  );

  if (!isValid) {
    return null;
  }

  return date;
}

// =====================================================================
//  工具函数：计算两个 Date 对象之间的时间差
//  返回对象包含：
//    - totalHours：差的总小时数（保留1位小数）
//    - days：折合的天数（整数）
//    - remainingHours：剩余小时数（保留1位小数）
// =====================================================================
function calcDiffHours(dateA, dateB) {
  // 取毫秒差的绝对值
  var diffMs = Math.abs(dateA.getTime() - dateB.getTime());

  // 毫秒 → 小时（保留1位小数）
  var totalHours = Math.round((diffMs / (1000 * 60 * 60)) * 10) / 10;

  // 折合为天 + 剩余小时（剩余小时也保留1位小数）
  var days = Math.floor(totalHours / 24);
  var rawRemainder = totalHours % 24;
  var remainingHours = Math.round(rawRemainder * 10) / 10;

  return {
    totalHours: totalHours,
    days: days,
    remainingHours: remainingHours
  };
}

// =====================================================================
//  核心计算逻辑：点击按钮后执行
// =====================================================================
calcBtn.addEventListener('click', function() {
  // ---------- 第1步：读取用户输入 ----------
  var rawA = inputA.value;
  var rawB = inputB.value;

  // 去除两端空白后的值，用于判断是否为空
  var trimmedA = rawA.trim();
  var trimmedB = rawB.trim();

  // ---------- 第2步：校验"至少一个不为空" ----------
  var bothEmpty = (trimmedA === '' && trimmedB === '');
  if (bothEmpty) {
    showError('至少需要输入一个时间！');
    return;
  }

  // ---------- 第3步：解析时间 A ----------
  var dateA;
  if (trimmedA === '') {
    // 输入A为空 → 使用当前系统时间
    dateA = new Date();
  } else {
    dateA = parseTimeString(trimmedA);
    if (dateA === null) {
      showError('「时间 A」格式不正确或日期无效，请检查输入。');
      return;
    }
  }

  // ---------- 第4步：解析时间 B ----------
  var dateB;
  if (trimmedB === '') {
    // 输入B为空 → 使用当前系统时间
    dateB = new Date();
  } else {
    dateB = parseTimeString(trimmedB);
    if (dateB === null) {
      showError('「时间 B」格式不正确或日期无效，请检查输入。');
      return;
    }
  }

  // ---------- 第5步：确定哪个时间"早"、哪个"晚" ----------
  var earlierDate;  // 较早的时间
  var laterDate;    // 较晚的时间
  var earlyLabel;   // 用于显示：哪个输入是早的

  if (dateA.getTime() <= dateB.getTime()) {
    earlierDate = dateA;
    laterDate   = dateB;
    earlyLabel  = 'A';
  } else {
    earlierDate = dateB;
    laterDate   = dateA;
    earlyLabel  = 'B';
  }

  // ---------- 第6步：类别一 —— 计算"早的时间的次日零点"与"晚的时间"的差 ----------
  // 构造次日零点：使用较早时间的年、月、日，日数 +1，时间设为 00:00:00
  var nextDayMidnight = new Date(
    earlierDate.getFullYear(),
    earlierDate.getMonth(),
    earlierDate.getDate() + 1,  // 日期 +1，JS 会自动处理跨月/跨年
    0, 0, 0
  );

  var cat1Result = calcDiffHours(nextDayMidnight, laterDate);

  // ---------- 第7步：类别二 —— 计算两个时间的直接差 ----------
  var cat2Result = calcDiffHours(dateA, dateB);

  // ---------- 第8步：渲染结果到页面 ----------
  renderResults(cat1Result, cat2Result, earlyLabel);

  // 清除之前的错误信息
  clearError();
});

// =====================================================================
//  显示错误信息
// =====================================================================
function showError(msg) {
  errorMsg.textContent = msg;
  // 出错时隐藏结果区域
  resultArea.style.display = 'none';
}

// =====================================================================
//  清除错误信息
// =====================================================================
function clearError() {
  errorMsg.textContent = '';
}

// =====================================================================
//  将计算结果渲染到页面上
//  cat1：类别一结果对象（{totalHours, days, remainingHours}）
//  cat2：类别二结果对象（{totalHours, days, remainingHours}）
//  earlyLabel：早的时间来自哪个输入框（"A" 或 "B"）
// =====================================================================
function renderResults(cat1, cat2, earlyLabel) {
  // 显示结果区域
  resultArea.style.display = 'block';

  // 类别一结果
  cat1HoursEl.textContent = cat1.totalHours + ' 小时';
  cat1DaysEl.textContent  = cat1.days + ' 天零 ' + cat1.remainingHours + ' 小时';

  // 类别二结果
  cat2HoursEl.textContent = cat2.totalHours + ' 小时';
  cat2DaysEl.textContent  = cat2.days + ' 天零 ' + cat2.remainingHours + ' 小时';

  // 早/晚信息
  var lateLabel = (earlyLabel === 'A') ? 'B' : 'A';
  orderInfoEl.innerHTML =
    '（时间 ' + earlyLabel + ' <span class="tag tag-early">早</span>，' +
    '时间 ' + lateLabel + ' <span class="tag tag-late">晚</span>）';
}
</script>

</body>
</html>
